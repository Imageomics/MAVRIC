# ============================================================================
# KABR UNIFIED FRAME SAMPLING CONFIGURATION
# ============================================================================

thresholds:
  # Temporal suppression distance: Any two selected frames for a specific animal
  # identity must be at least this many seconds apart.
  t_seconds: 5

  # The FPS used during detection and tracking.
  # Used to convert t_seconds into a frame-based distance.
  frame_interval: 15

  # Global Quality Gate: A frame is only considered a candidate if its
  # CA_score is >= (this percentage) of the best CA_score found in that
  # entire animal's track. (0.8 = 80%).
  quality_threshold_pct: 0.9

settings:
  # 'one': Selects exactly one absolute best CA_score frame per track per viewpoint.
  # 'many': Uses the full NMS-in-time and Stratified RA sampling logic.
  selection_mode: 'many'

  # Final Sampling Cap: If more than this many frames survive the quality and
  # time filters, the script divides the encounter into equal time segments
  # and picks the best one from each.
  num_RA_annots: 10

  # Master Switch:
  # true: Use Class Accuracy (CA) scores to find peaks and best quality.
  # false: Use random sampling (CA score ignored).
  use_ca_score: true

  # Identity Separation:
  # true: Treat different viewpoints (e.g., Left vs Right flank) of the same
  #       tracking ID as separate entities.
  # false: Treat all annotations for a tracking ID as a single encounter.
  use_viewpoint: true

  # Deterministic Seed: Ensures that any random operations (like tie-breaking
  # in random mode) produce identical results every time the script is run.
  seed: 123456789
